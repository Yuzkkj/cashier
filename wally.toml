[package]
name = "yuzkkj/cashier"
version = "0.2.4"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
description = "A clean, robust Roblox library to streamline Gamepass, Developer Product, and Gifting management."
repository = "https://github.com/Yuzkkj/cashier"
license = "MIT"
authors = ["Yuz"]
exclude = ["**"]
include = [
    "default.project.json",
    "src",
    "src/**",
    "wally.toml",
]

[dependencies]
Networker = "leifstout/networker@0.3.1"
Sift = "csqrl/sift@0.0.11"
Signal = "sleitnick/signal@2.0.3"

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"